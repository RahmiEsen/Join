<aside>
    <nav>
        <button
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >
            <div class="img-wrapper">
                <img
                [src]="'./assets/images/' + item.icon"
                [alt]="item.label"
                />
            </div>
            <p>{{ item.label }}</p>
        </button>
    </nav>
</aside>
