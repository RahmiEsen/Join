<div class="options-container">
    <app-selected-label
        *ngIf="selectedLabels && selectedLabels.length > 0"
        [selectedLabels]="selectedLabels"
        [availableLabels]="availableLabels"
        (click)="onLabelClick(); $event.stopPropagation()">
    </app-selected-label>
    <app-selected-date 
        *ngIf="startDate || endDate"
        [startDate]="startDate"
        [endDate]="endDate"
        (click)="onDateClick(); $event.stopPropagation()">
    </app-selected-date>
</div>
