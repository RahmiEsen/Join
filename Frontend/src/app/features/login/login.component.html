<img class="logo"
src="assets/images/logo-dark.png" 
alt="Logo">
<div class="singup-wrapper">
    <span>Not a Join user?</span>
    <button (click)="goToSignup()" class="btn-signup">Sign up</button>
</div>
<div class="card">
    <div class="headline">
        <h1>Log  in</h1>
        <div class="underline"></div>
    </div>
    <form action="">
        <div *ngFor="let field of formFields" class="form-wrapper">
            <div class="form-group">
                <input [type]="field.type" [placeholder]="field.placeholder" />
                <div class="form-icon">
                    <img [src]="'assets/images/' + field.icon" [alt]="field.alt" />
                </div>
            </div>
            <div class="errortext">
                <p class="error">Check your email and password. Please try again.</p>
            </div>
        </div>
    </form>
    <div class="button-wrapper">
        <button>Log in</button>
        <button class="secondary-btn">Guest Log in</button>
    </div>
</div>
<footer>
    <a href="">Privacy Policy</a>
    <a href="">Legal notice</a>
</footer>
