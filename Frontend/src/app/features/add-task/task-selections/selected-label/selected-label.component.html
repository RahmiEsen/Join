<div class="label-wrapper">
    <span>Labels</span>
    <div class="choosen-labels">
        <span class="label"
            *ngFor="let labelId of selectedLabels" [ngStyle]="{
                '--base-color': getLabelById(labelId)?.color,
                '--hover-color': getLabelById(labelId)?.hover
            }">
            {{ getLabelById(labelId)?.title }} </span>
    </div>
</div>
