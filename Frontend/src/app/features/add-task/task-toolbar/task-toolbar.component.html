<div class="option-section">
    <app-dropdown
        #labelDropdown [title]="labelTitle"
        [title]="labelTitle"
        [showBackButton]="labelSelector?.viewMode === 'edit' || labelSelector?.viewMode === 'create'"
        (backClicked)="labelSelector?.exitEdit()"
        iconSrc="assets/images/label.png"
        iconActiveSrc="assets/images/label-active.png"
        (closed)="labelSelector?.exitEdit()">
        <div class="option-content">
            <app-label-selector 
                [availableLabels]="availableLabels"
                [selectedLabels]="selectedLabels"
                (selectedLabelsChange)="selectedLabelsChange.emit($event)"#labelSelector>
            </app-label-selector>
        </div>
    </app-dropdown>
    <app-dropdown
        #dateDropdownRef
        title="Date"
        iconSrc="assets/images/date.png"
        iconActiveSrc="assets/images/date-active.png">
        <div class="option-content">
            <app-date-selector 
                (closeRequested)="dateDropdownRef.close()"
                (dateSelected)="dateSelected.emit($event)"
                (dateCleared)="dateCleared.emit()"
                [initialStartDate]="startDate"
                [initialEndDate]="endDate"> 
            </app-date-selector>
        </div>
    </app-dropdown>
    <app-dropdown
        title="Checklist"
        [headerTitle]="'Add checklist'"
        iconSrc="assets/images/checklist.png"
        iconActiveSrc="assets/images/checklist-active.png"
        #checklistDropdown>
        <div class="option-content">
            <app-checklist-selector 
                (closeRequested)="checklistDropdown.close()"
                (checklistCreated)="handleChecklistCreated($event)">
            </app-checklist-selector>
        </div>
    </app-dropdown>
    <app-dropdown
        #memberDropdown
        title="Members"
        iconSrc="assets/images/add-person.png"
        iconActiveSrc="assets/images/add-person-active.png">
        <div class="option-content">
            <app-member-selector
                [contacts]="allContacts"
                [initialSelection]="initialMembers"
                (selectionChange)="updateMembers($event)">
            </app-member-selector>
        </div>
    </app-dropdown>
</div>
