<div class="list-wrapper">
    <header
    (click)="enableTitleEdit()">
        <input 
            #titleInput
            type="text"
            [class.editable]="isEditingTitle"
            [(ngModel)]="editedTitle"
            (blur)="saveTitle()"
            (keyup.enter)="saveTitle()">
        <button class="more-options-btn"
        [class.active]="isMenuOpen"
        (click)="toggleDropdown($event)">
            <img *ngIf="!isMenuOpen" src="assets/images/more-horz.png" alt="More">
            <img *ngIf="isMenuOpen" src="assets/images/more-horz-active.png" alt="More Active">
        </button>
    </header>
    <div class="dropdown"
    *ngIf="isMenuOpen">
        <div class="menu-header">
            <p>List actions</p>
            <button class="close"
            (click)="toggleDropdown($event)">
                <img src="assets/images/close.png" alt="Close">
            </button>
        </div>
        <div class="content" (click)="onDeleteList()">
            <span>Delete</span>
            <img src="assets/images/delete.png" alt="Delete">
        </div>
        <div class="content" (click)="onDeleteList()">
            <span>Delete</span>
            <img src="assets/images/delete.png" alt="Delete">
        </div>
    </div>
    <div class="task-wrapper"
        cdkDropList
        [id]="listId"
        [cdkDropListData]="tasks"
        [cdkDropListConnectedTo]="connectedListIds"
        (cdkDropListDropped)="onTaskDropped($event)">
        <app-task-card 
            *ngFor="let task of tasks"
            cdkDrag
            [cdkDragData]="task"
            [task]="task" 
            (openEditRequest)="onOpenTaskEdit($event)">
        </app-task-card>
    </div>
    <app-add-task-form (taskAdded)="onAddTask($event)"></app-add-task-form>
</div>
