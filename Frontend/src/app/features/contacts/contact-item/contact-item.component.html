<div class="contact" [ngClass]="{ active: isActive }" (click)="contactClicked.emit()">
  <div class="avatar">{{ getInitials(contact.firstName, contact.lastName) }}</div>
  <div class="info-wrapper">
    <span class="contact-name">{{ contact.firstName }} {{ contact.lastName }}</span>
    <a class="contact-mail">{{ contact.email }}</a>
  </div>
</div>
